<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 400' width='900' height='400' font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", Times, serif' role='img' aria-labelledby='title desc'>
<title id='title'>Silicon carbide half-space between Floquet ports</title>
<desc id='desc'>Section of the periodic unit cell along the normal of the ports: Floquet port 1 in vacuum half a micrometer above the surface of the silicon carbide, and Floquet port 2 a quarter of a micrometer below it, inside the silicon carbide, which continues beyond port 2 as a half-space. A plane wave is incident on the surface at normal incidence, and is reflected to port 1 and transmitted to port 2.</desc>
<defs>
<marker id='head-ink' viewBox='0 0 10 10' refX='8.5' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto'><path d='M0,0.5 L10,5 L0,9.5 L2.8,5 z' fill='#1a1a1a'/></marker>
<marker id='head-red' viewBox='0 0 10 10' refX='8.5' refY='5' markerWidth='6.5' markerHeight='6.5' orient='auto'><path d='M0,0.5 L10,5 L0,9.5 L2.8,5 z' fill='#c0392b'/></marker>
<marker id='dim-end' viewBox='0 0 10 10' refX='10' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0,1.8 L10,5 L0,8.2 z' fill='#1a1a1a'/></marker>
<marker id='dim-start' viewBox='0 0 10 10' refX='0' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M10,1.8 L0,5 L10,8.2 z' fill='#1a1a1a'/></marker>
<pattern id='sic' width='7' height='7' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='7' height='7' fill='#f3ece2'/><line x1='0' y1='0' x2='0' y2='7' stroke='#8c7b67' stroke-width='1.0'/></pattern>
<linearGradient id='fade' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='white' stop-opacity='0'/><stop offset='1' stop-color='white' stop-opacity='1'/></linearGradient>
</defs>
