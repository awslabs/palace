<line x1='440.0' y1='80.0' x2='440.0' y2='300.0' stroke='#1a1a1a' stroke-width='1.6' />
<line x1='140.0' y1='80.0' x2='590.0' y2='80.0' stroke='#666666' stroke-width='1.0' stroke-dasharray='12 4 3 4'/>
