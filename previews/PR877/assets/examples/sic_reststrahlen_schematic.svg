<text x='590.0' y='52.0' font-size='17' text-anchor='middle' fill='#1a1a1a' >Floquet port 2</text>
<line x1='170.0' y1='146.0' x2='410.0' y2='146.0' stroke='#c0392b' stroke-width='2.2' marker-end='url(#head-red)'/>
