<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 560' width='1200' height='560' font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", Times, serif' role='img' aria-labelledby='title desc'>
<title id='title'>Cylindrical cavity filled with a Lorentz medium</title>
<desc id='desc'>Axial section of a PEC cylindrical cavity filled with a Lorentz medium, with the TM010 electric and magnetic field profiles, and the graphical solution of the mode condition omega squared times the relative permittivity equals epsilon infinity times the cavity frequency squared, which has one root on each side of a gap of negative permittivity between the resonance and the longitudinal frequency.</desc>
