# Template to build a fully configured Palace with Spack.
# 
# - Compiler: GCC 15
# - Math library: OpenBlas
# - MPI Implementation: OpenMPI (with AWS EFA)

spack:
  concretizer:
    reuse: false     # Do not force re-using existing binaries
    unify: true      # Ensure that there is only one copy of each package
    targets:         # Compile for the local microarchitecture
      granularity: microarchitectures
  config:       
    # Some upstream source mirrors are selected through redirects and can fail
    # transiently. Let curl retry 5xx responses before failing the full build.
    url_fetch_method: "curl --retry 10 --retry-delay 2 --retry-max-time 120"
    # Padding is needed to ensure that the binaries can be relocated. Without
    # padding, RPATH might be to short to allow for arbitrary relocation (so
    # that the package has to be recompiled).
    install_tree:
      padded_length: 256
    # Folders where to look for PalaceDockerfile
    # $env is the current environment
    # $spack is the spack root
    template_dirs:
      - "."
      - $env
      - $spack/share/spack/templates
  packages:
    all:
      require: ~openmp       # We don't want any package with OpenMP
    # Enable AWS EFA
    libfabric:
      require: fabrics=efa,lnx,mrail,rxm,shm,sockets,tcp,udp
    # We do not want to include the full Python stack in the container
    rdma-core:
      require: ~pyverbs
  container:
    format: docker
    template: PalaceDockerfile
    images:
      os: "ubuntu:24.04"
      # Pinned to the Spack 1.2 release series (prebuilt spack/ubuntu-noble:1.2
      # image on Docker Hub) instead of the moving `develop` tag.
      spack: "1.2"
  # Find pre-compiled packages in binary caches. Requires GITHUB_USER and
  # GITHUB_TOKEN (or a personal access token).
  #
  # Remove this if you do not want to use binary mirrors
  mirrors:
    spack:
      binary: true
      url: https://binaries.spack.io/develop
    local-buildcache:
      binary: true
      url: oci://ghcr.io/awslabs/palace-1.2
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN
  # A non-empty PALACE_CUDA_ARCH adds CUDA constraints to the common
  # Palace root spec.
  definitions:
  - palace_base:
    - >-
      palace@develop+libxsmm+superlu-dist+mumps+sundials+strumpack+slepc+arpack+int64
      %gcc@15 ^openblas ^openmpi schedulers=none fabrics=ofi
  - cuda_constraints:
    # `==` propagates the architecture to every CUDA-capable dependency. For
    # direct use, replace 80 with the desired comma-separated capabilities;
    # the build-container action performs this replacement from its input.
    - >-
      +cuda+cudss cuda_arch==80 ^cuda@13
      ^openmpi+cuda
      ^libfabric+cuda+cuda_dlopen
  - when: not env.get("PALACE_CUDA_ARCH")
    palace:
    - $palace_base
  - when: env.get("PALACE_CUDA_ARCH")
    palace:
    - matrix:
      - [$palace_base]
      - [$cuda_constraints]
  specs:
    # FIXME(awslabs/palace#731): re-enable the `compilers` spec group when the
    # underlying Spack spec-groups bug is fixed; gcc-15 is currently apt-
    # installed in PalaceDockerfile.
    #
    # - group: compilers
    #   # explicit false means that we do not want to include this in the
    #   # container, unless something depends on it
    #   explicit: false
    #   specs:
    #     # If you change this, you might need to change PalaceDockerfile so
    #     # that we remove the compiler from the container
    #     - gcc@15
    #   override:
    #     concretizer:
    #       # Do not force the target to be specific, let it generic, so that
    #       # we can reuse compilers across different machines.
    #       targets:
    #         granularity: generic
  - group: palace
    # FIXME(awslabs/palace#731): re-enable with `compilers` group above.
    # needs: [compilers]
    specs:
    - $palace
    override:
      develop:
        palace:
          spec: palace@=develop
          path: /opt/palace
