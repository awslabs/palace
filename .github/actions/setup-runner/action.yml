name: 'Setup Runners'
description: 'Common steps to prepare the environment to run Palace tests'
inputs:
  spack-version:
    description: 'Spack git ref to use (e.g. develop, releases/v1.2)'
    required: false
    default: 'releases/v1.2'
  spack-packages-commit:
    description: 'spack-packages commit used by the builtin Spack repository'
    required: false
    default: 'c3b260e171988c0ef05220174e8ada7efdbd6499'
  llvm-version:
    description: 'Version of LLVM to use (only major version supported, e.g. "19")'
    required: false
    default: 'dont-install'
  setup-intel:
    description: 'Install Intel OneAPI'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:

    # Unfortunately, GitHub hides all the timing information for the various
    # steps when composite actions are used. Timing is useful to optimize
    # runtime, so we add a bash function that computes the time a step (or
    # substep) takes. The function is used in the following way:
    # 
    # - start the timer by calling `start_timer`
    # - end the timer with `end_timer "Name of timer"`
    # 
    # The result is stored to a file /tmp/timing.log, this file can be printed
    # to stdout at the end of the execution of the action.
    - name: Initialize timing functions
      shell: bash
      run: |
        echo "=== TIMING LOG ===" > /tmp/timing.log
        cat << 'EOF' > /tmp/timing_functions.sh
        start_timer() { export STEP_START=$(date +%s); }
        end_timer() {
          local duration=$(($(date +%s) - STEP_START))
          local formatted_time
          if [ $duration -lt 60 ]; then
            formatted_time="${duration}s"
          elif [ $duration -lt 3600 ]; then
            local minutes=$((duration / 60))
            local seconds=$((duration % 60))
            formatted_time="${minutes}m ${seconds}s"
          else
            local hours=$((duration / 3600))
            local minutes=$(((duration % 3600) / 60))
            local seconds=$((duration % 60))
            formatted_time="${hours}h ${minutes}m ${seconds}s"
          fi
          echo "$1: $formatted_time" >> /tmp/timing.log
        }
        EOF

    # A freshly booted runner races us: systemd's apt-daily / unattended-upgrade
    # units kick off their own apt-get on boot and hold the dpkg lock, which
    # makes the `apt-get install` steps below die with exit code 100.
    #
    # We prevent that by:
    #   1. Stopping the periodic APT units and their timers.
    #   2. Configuring later apt/apt-get package operations to wait for dpkg's
    #      locks instead of deleting lock files or failing immediately.
    - name: Disable unattended upgrades
      shell: bash
      run: |
        # Stop the periodic APT units and ask unattended-upgrades to shut down
        # cleanly. Any remaining dpkg lock contention is handled by the timeout
        # below.
        sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
        sudo systemctl stop apt-daily.service apt-daily-upgrade.service || true
        sudo systemctl stop unattended-upgrades.service || true

        # Keep them from restarting for the life of the job.
        sudo systemctl disable apt-daily.timer apt-daily-upgrade.timer || true

        # Make every apt/apt-get call in this job wait (up to 10 min) for the
        # dpkg lock instead of erroring out immediately with exit code 100.
        echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout

        # Recover the dpkg database if a killed/interrupted upgrade left it
        # half-configured. Safe now that the units above are stopped.
        sudo dpkg --configure -a || true

        # Turn off the periodic download/upgrade config too.
        echo 'APT::Periodic::Update-Package-Lists "0";' | sudo tee /etc/apt/apt.conf.d/20auto-upgrades
        echo 'APT::Periodic::Unattended-Upgrade "0";' | sudo tee -a /etc/apt/apt.conf.d/20auto-upgrades

    - name: Setup repositories
      if: inputs.llvm-version != 'dont-install' || inputs.setup-intel == 'true'
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer

        # Intel
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
        | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        
        # LLVM
        CODENAME=$(lsb_release -cs) # Ubuntu 24 is "noble"
        echo "deb http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -

        sudo apt update

        end_timer "Setup repositories"

    - name: Setup gh
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        sudo apt-get install -y gh
        end_timer "Setup gh"

    - name: Setup Intel OneAPI
      if: inputs.setup-intel == 'true'
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-compiler-fortran intel-oneapi-mkl-devel intel-oneapi-mpi-devel
        end_timer "Setup Intel OneAPI"

    - name: Setup LLVM
      if: inputs.llvm-version != 'dont-install'
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: |
        source /tmp/timing_functions.sh
        start_timer
        sudo apt-get install -y \
          clang-${LLVM_VERSION} llvm-${LLVM_VERSION} libclang-${LLVM_VERSION}-dev \
          lld-${LLVM_VERSION} lldb-${LLVM_VERSION} \
          libomp5-${LLVM_VERSION} libomp-${LLVM_VERSION}-dev flang-${LLVM_VERSION} \
          libzstd-dev
        end_timer "Setup LLVM"

    - name: Setup GNU
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        sudo apt-get install -y gcc g++ gfortran libgomp1
        end_timer "Setup GNU"
        
    - name: Install Spack
      uses: actions/checkout@v6
      with:
        repository: spack/spack
        path: spack
        ref: ${{ inputs.spack-version }}
        
    - name: Setup Spack environment
      shell: bash
      run: |
        echo "$(realpath spack/bin)" >> "$GITHUB_PATH"
        echo "SPACK_DISABLE_LOCAL_CONFIG=1" >> "$GITHUB_ENV"
        echo "SPACK_COLOR=always" >> "$GITHUB_ENV"

    - name: Pin Spack packages
      if: inputs.spack-packages-commit != ''
      shell: bash
      env:
        SPACK_PACKAGES_COMMIT: ${{ inputs.spack-packages-commit }}
      run: |
        spack repo update --commit "$SPACK_PACKAGES_COMMIT" builtin
        test "$(git -C "$(spack location --repo builtin)" rev-parse HEAD)" = \
          "$SPACK_PACKAGES_COMMIT"

    - name: Patch Spack package.py files for known problems
      shell: bash
      run: |
        PALACE_DIR=$PWD
        cd $(spack location --repo builtin)
        for patch in "$PALACE_DIR"/spack_repo/patches/*.diff; do
          if [ -f "$patch" ]; then
            if ! git apply --check "$patch" 2>/dev/null; then
              echo "Cannot apply $patch (PR may have already been merged)"
              echo "Please remove $patch from the Palace repo if the PR was merged"
            else
              echo "Applying patch: $patch"
              git apply "$patch"
            fi
          fi
        done

        # Workaround for https://github.com/spack/spack/issues/51505.
        # -f so a runner that did not fully clean spack_repo/local/packages from
        # a prior job does not abort here on an existing link.
        ln -sf "$(spack location --repo builtin)"/packages/mfem "$PALACE_DIR"/spack_repo/local/packages/
