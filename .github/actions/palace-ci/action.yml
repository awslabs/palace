name: 'Palace CI'
description: 'Run Palace CI with Spack'
inputs:
  toolchain:
    description: 'Toolchain to use'
    required: true
  variant:
    description: 'Palace variant'
    required: false
    default: ''
  math-libs:
    description: 'Math libraries'
    required: false
    default: ''
  run-regression-tests:
    description: 'Run regression tests after build'
    required: false
    default: 'true'
  use-develop-deps:
    description: 'Use develop versions of key dependencies'
    required: false
    default: 'false'
  test-cases:
    description: 'Test cases: "default", "long", or space-separated list'
    required: false
    default: 'default'
  additional-test-cases:
    description: 'Additional test cases to run after default tests (space-separated list)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup-runner
      with:
        julia-version: 'release'
        # Spack develop because we want to have access to the most recent
        # version of spack-packages
        spack-version: 'develop'
        # LLVM 19 because it is the latest supported by CUDA 12.9
        llvm-version: ${{ inputs.toolchain == 'llvm' && '19' || 'dont-install' }}
        setup-intel: ${{ inputs.toolchain == 'intel-oneapi' && 'true' || 'false' }}

    - name: Prepare spack.yaml
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        if [[ "${{ inputs.variant }}" == *"+cuda"* ]]; then
          CUDA_ARCH=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d '.')
          CUDA_ARGS="cuda_arch=${CUDA_ARCH}"
        else
          CUDA_ARGS=""
        fi

        # As of version 1.2.0-alpha, the spack concretizer hangs when using flang.
        # Also https://github.com/libxsmm/libxsmm/issues/996
        # TODO: Try again in the future to see if we can use it.
        if [[ "${{ inputs.toolchain }}" == "llvm" ]]; then
          FORTRAN_COMPILER="gcc"
        else
          FORTRAN_COMPILER="${{ inputs.toolchain }}"
        fi

        if [[ "${{ inputs.toolchain }}" == "intel-oneapi" ]]; then
          MATH_LIBS="${{ inputs.math-libs || 'intel-oneapi-mkl' }}"
          MPI_IMPL="intel-oneapi-mpi"
          C_CXX_COMPILER="intel-oneapi-compilers"
          FORTRAN_COMPILER="intel-oneapi-compilers"
        else
          MATH_LIBS="${{ inputs.math-libs || 'openblas' }}"
          MPI_IMPL="openmpi"
          C_CXX_COMPILER="${{ inputs.toolchain }}"
        fi
        PALACE_SPEC="local.palace@develop+libxsmm+superlu-dist+mumps+sundials+strumpack+slepc+arpack${{ inputs.variant }} ${CUDA_ARGS}"

        cat << EOF > spack.yaml
        spack:
          specs:
            - ${PALACE_SPEC}
          view: false
          config:
            install_tree:
              root: ${HOME}/opt/spack
              # We add a lot of padding to support better cache relocation
              # https://spack.readthedocs.io/en/latest/binary_caches.html#relocation
              padded_length: 256
          concretizer:
            reuse: false
            unify: true
          packages:
            petsc:
              require: ~hdf5
            mpi:
              require: ${MPI_IMPL}
            blas:
              require: ${MATH_LIBS}
            lapack:
              require: ${MATH_LIBS}
            c:
              require: [${C_CXX_COMPILER}]
            cxx:
              require: [${C_CXX_COMPILER}]
            fortran:
              require: [${FORTRAN_COMPILER}]
            # Metis is verify fragile
            # -fPIC seems to be required because metis always compiles some shared objects
            # -lc seems to be required for intel compilers
            metis:
              require: cflags=-fPIC cppflags=-fPIC ldflags=-lc
            parmetis:
              require: ldflags=-lc
        EOF

        # The Intel compiler has problems with C/C++/Fortran interop in MUMPS.
        # Fixes: for_main.c:(.text+0x19): undefined reference to `MAIN__'
        # libffi 3.5.2's configure trips icx on a gcc-only option.
        if [[ "${{ inputs.toolchain }}" == "intel-oneapi" ]]; then
          # oneAPI components are not redistributable so they can never come
          # from the buildcache; use the apt-installed copies (see setup-runner)
          # at whatever version apt provides, like the compiler.
          MKL_VERSION=$(basename "$(find /opt/intel/oneapi/mkl -mindepth 1 -maxdepth 1 -name '2*' | sort -V | tail -1)")
          MPI_VERSION=$(basename "$(find /opt/intel/oneapi/mpi -mindepth 1 -maxdepth 1 -name '2*' | sort -V | tail -1)")
          cat << INTELEOF >> spack.yaml
            mumps:
              require: fflags=-nofor-main
            libffi:
              require: "@:3.4.8"
            intel-oneapi-mkl:
              buildable: false
              externals:
              - spec: intel-oneapi-mkl@${MKL_VERSION}
                prefix: /opt/intel/oneapi
            intel-oneapi-mpi:
              buildable: false
              externals:
              - spec: intel-oneapi-mpi@${MPI_VERSION}
                prefix: /opt/intel/oneapi
        INTELEOF
        fi

        if [[ "${{ inputs.use-develop-deps }}" == "true" ]]; then
          cat << DEVEOF >> spack.yaml
            hypre:
              require: "@develop"
            mfem:
              require: "@develop+exceptions"
        DEVEOF
        else
          cat << EXEOF >> spack.yaml
            mfem:
              require: "+exceptions"
        EXEOF
        fi

        if [[ "${{ inputs.variant }}" == *"+cuda"* ]]; then
          cat << CUDAEOF >> spack.yaml
            cuda:
              buildable: false
              externals:
              - spec: cuda@12.9
                prefix: /usr/local/cuda-12.9/
            # When some packages are built with OpenMP in a non-OpenMP build,
            # FindSTRUMPACK in MFEM cannot compile the test program. Hopefully,
            # we can remove this when MFEM is not in the superbuild.
            all:
              require: ~openmp
        CUDAEOF
        fi

        cat << EOF >> spack.yaml
          repos:
          - spack_repo/local
          mirrors:
            spack:
              binary: true
              url: https://binaries.spack.io/develop
            local-buildcache:
              binary: true
              url: oci://ghcr.io/awslabs/palace-develop-testing
              signed: false
              access_pair:
                id_variable: GITHUB_USER
                secret_variable: GITHUB_TOKEN
        EOF

    - name: Configure Compilers
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        if [[ "${{ inputs.toolchain }}" == "intel-oneapi" ]]; then
          . /opt/intel/oneapi/setvars.sh
        fi
        spack -e . compiler find && spack -e . compiler list
        end_timer "Configure Compilers"

    - name: Display spack.yaml
      shell: bash
      run: |
        echo "=== Generated spack.yaml ==="
        cat spack.yaml
        echo "=== End spack.yaml ==="

    - name: Configure Binary Mirror Keys
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        spack -e . buildcache keys -y --install --trust
        end_timer "Configure Binary Mirror Keys"

    - name: Bootstrap
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        spack -e . bootstrap now
        end_timer "Bootstrap"

    - name: Concretize
      shell: bash
      env:
        PALACE_REF: ${{ github.head_ref || github.ref_name }}
      run: |
        source /tmp/timing_functions.sh
        start_timer
        PALACE_REF="${PALACE_REF//\//-}"
        spack -e . develop --path=$(pwd) local.palace@git."${PALACE_REF}"=develop
        spack -e . concretize -f --test root
        end_timer "Concretize"

    - name: Build Dependencies
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        # Bank built deps even if the install later fails. The CLI push skips
        # non-redistributable specs (the autopush hook does not, so it is not
        # used); skip --update-index since installs probe OCI tags directly.
        bank_progress() {
          spack -e . buildcache push --allow-missing --with-build-dependencies --only dependencies --unsigned local-buildcache || true
        }
        # No --fail-fast: build (and bank) everything possible; retry to ride
        # out transient source-fetch failures.
        attempts=3
        for attempt in $(seq 1 "$attempts"); do
          if spack -e . install --only-concrete --no-check-signature --show-log-on-error --include-build-deps --only dependencies --test root -j $(nproc); then
            bank_progress
            break
          fi
          bank_progress
          if [ "$attempt" -eq "$attempts" ]; then
            echo "Dependency installation failed after ${attempts} attempts."
            exit 1
          fi
          echo "Dependency installation attempt ${attempt} failed; retrying."
        done
        end_timer "Build Dependencies"

    - name: Print @develop commit hashes
      if: inputs.use-develop-deps == 'true'
      shell: bash
      run: |
        echo "=== @develop package commit hashes ==="
        echo "hypre: $(git ls-remote https://github.com/hypre-space/hypre.git HEAD | cut -f1)"
        echo "mfem: $(git ls-remote https://github.com/mfem/mfem.git HEAD | cut -f1)"
        echo "=== end @develop hashes ==="

    - name: Build Palace
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        spack -e . install --only-concrete --keep-stage --show-log-on-error --only package --no-cache --test root -j $(nproc)
        end_timer "Build Palace"

    - name: Run Build Information Tests
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        spack_environment=$PWD
        eval "$(spack -e "$spack_environment" load --sh palace)"

        # These dependency-free CTests run for every installed configuration, including
        # long-test jobs where the Catch2 suite is intentionally skipped.
        cd "$(spack -e "$spack_environment" location -b palace)"
        ctest --no-tests=error --output-on-failure --tests-regex '^build-info-'

        # Validate Spack's producer-specific version/hash payload through the public CLI.
        nonexistent_launcher="/tmp/palace-build-info-nonexistent-launcher-$$"
        rm -f "$nonexistent_launcher"
        version_output=$(palace --launcher "$nonexistent_launcher" --version)
        printf '%s\n' "$version_output"
        dependency_lines=$(printf '%s\n' "$version_output" |
          awk '/^Build dependencies:$/ { in_dependencies = 1; next }
               in_dependencies && /^  / { print }')
        if [[ -z "$dependency_lines" ]]; then
          echo "Palace --version reported no Spack dependency metadata" >&2
          exit 1
        fi
        # Independently bind every public label to its concrete package. This catches
        # malformed hashes, swapped values, unknown labels, and omitted records.
        export PALACE_REPORTED_DEPENDENCIES="$dependency_lines"
        PALACE_CONCRETE_DAG=$(spack -e "$spack_environment" find -d \
          --format '{name}={version}/{hash:7}' palace)
        export PALACE_CONCRETE_DAG
        python3 <<'PY'
        import os
        import re

        package_for_label = {
            "STRUMPACK": "strumpack",
            "arpack_ng": "arpack-ng",
            "butterflypack": "butterflypack",
            "eigen": "eigen",
            "fmt": "fmt",
            "gslib": "gslib",
            "hypre": "hypre",
            "json": "nlohmann-json",
            "json_schema_validator": "nlohmann-json-schema-validator",
            "libCEED": "libceed",
            "libxsmm": "libxsmm",
            "magma": "magma",
            "metis": "metis",
            "mfem": "mfem",
            "mumps": "mumps",
            "parmetis": "parmetis",
            "petsc": "petsc",
            "scalapack": "scalapack",
            "scn": "scnlib",
            "slepc": "slepc",
            "sundials": "sundials",
            "superlu_dist": "superlu-dist",
            "umpire": "umpire",
            "zfp": "zfp",
        }
        dag = {}
        for line in os.environ["PALACE_CONCRETE_DAG"].splitlines():
            package, separator, value = line.strip().partition("=")
            if separator:
                dag[package] = value

        row_pattern = re.compile(r"^  ([A-Za-z][A-Za-z0-9_]*): (.+/[a-z0-9]{7})$")
        reported = {}
        for line in os.environ["PALACE_REPORTED_DEPENDENCIES"].splitlines():
            match = row_pattern.fullmatch(line)
            if not match:
                raise SystemExit(f"Malformed Spack dependency metadata row: {line}")
            label, value = match.groups()
            if label in reported:
                raise SystemExit(f"Duplicate Spack dependency metadata label: {label}")
            reported[label] = value

        expected = {
            label: dag[package]
            for label, package in package_for_label.items()
            if package in dag
        }
        if reported != expected:
            missing = sorted(expected.keys() - reported.keys())
            unexpected = sorted(reported.keys() - expected.keys())
            mismatched = sorted(
                label
                for label in expected.keys() & reported.keys()
                if expected[label] != reported[label]
            )
            raise SystemExit(
                "Spack dependency metadata does not match its concrete package DAG: "
                f"missing={missing}, unexpected={unexpected}, mismatched={mismatched}"
            )
        PY
        unset PALACE_REPORTED_DEPENDENCIES PALACE_CONCRETE_DAG

        end_timer "Run Build Information Tests"

    # We don't want to run unit tests as part of the long test run. They are
    # already run elsewhere.
    - name: Run Unit Tests
      if: inputs.test-cases != 'long'
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        eval "$(spack -e . load --sh palace)"

        # Use nproc, but halve to account for hyperthreading.
        # NOTE: This CI action only runs on Linux runners (lscpu/nproc are Linux-specific).
        LOGICAL_CORES=$(nproc)
        THREADS_PER_CORE=$(lscpu | grep "Thread(s) per core" | awk '{print $4}')
        if [ "$THREADS_PER_CORE" = "2" ]; then
            export NUM_PROC_TEST=$((LOGICAL_CORES / 2))
        else
            export NUM_PROC_TEST=$LOGICAL_CORES
        fi

        if [[ "${{ inputs.variant }}" == *"+openmp"* ]]; then
          NUM_PROC_TEST=$(( NUM_PROC_TEST / 2 ))
          export OMP_NUM_THREADS=2
        else
          export OMP_NUM_THREADS=1
        fi

        cd "$(spack -e . location -b palace)"

        # Skip serial/mpi libCEED tests on CUDA builds due to umpire host memory
        # allocation bug.
        #
        # TODO: Remove this when MFEM/Palace switches to using standard host
        # allocation.
        if [[ "${{ inputs.variant }}" == *"+cuda"* ]]; then
          CTEST_EXCLUDE="--exclude-regex (serial|mpi)-.*libCEED"
        else
          CTEST_EXCLUDE=""
        fi

        # Disable OpenMPI 5.x default CPU binding so MPI processes don't starve
        # OpenMP threads during parallel test execution. OpenMPI 5.x uses PRRTE,
        # so we set both the PRTE and legacy OMPI MCA variables for robustness.
        export PRTE_MCA_hwloc_default_binding_policy=none
        export OMPI_MCA_hwloc_base_binding_policy=none

        # Runs all hardware-compatible tests, skipping Catch2 benchmarks.
        ctest -j $NUM_PROC_TEST --output-on-failure $CTEST_EXCLUDE

        end_timer "Run Unit Tests"

    # We upload the spack environment as an artifact so that next runners can
    # pick up the very same environment and have consistent binaries (pulled
    # from the cache).
    - name: Upload spack environment
      uses: actions/upload-artifact@v7
      if: inputs.run-regression-tests != 'true'
      with:
        name: spack-env-${{ runner.arch }}-${{ inputs.toolchain }}-${{ inputs.variant || 'default' }}-${{ inputs.math-libs || 'default' }}
        path: |
          spack.yaml
          spack.lock
        retention-days: 7

    - name: Push to GHCR cache
      shell: bash
      run: |
        source /tmp/timing_functions.sh
        start_timer
        # Push deps only; Palace itself is branch-specific (same reason as the container build).
        spack -e . buildcache push --force --with-build-dependencies --only dependencies --unsigned --update-index local-buildcache || true
        end_timer "Push to GHCR cache"

    - name: Run Regression Tests
      if: inputs.run-regression-tests == 'true'
      uses: ./.github/actions/run-regression-tests
      with:
        testing-on-build-runner: 'true'
        variant: ${{ inputs.variant }}
        test-cases: ${{ inputs.test-cases }}
        additional-test-cases: ${{ inputs.additional-test-cases }}

    # We print timing if we don't run the regression tests, otherwise, it will
    # be regression test job that prints the file. (This is for the build-xxx
    # jobs)
    - name: Timing information
      if: inputs.run-regression-tests != 'true'
      shell: bash
      run: |
        cat /tmp/timing.log

