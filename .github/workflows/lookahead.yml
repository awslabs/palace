name: Lookahead

# Test Palace with newer versions of the dependencies. This test is meant to
# provide early signals that something upstream has changed/needs attention.
#
# This test is not required to pass to merge PRs and it is not run on main (so
# that we can have a green tick).

on:
  pull_request:
  workflow_dispatch:

permissions:
  packages: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Filter to allow skipping the test if no relevant changes occurred.
  filter:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            test:
              - 'palace/**'
              - 'cmake/**'
              - 'extern/**'
              - 'examples/**'
              - 'test/unit/**'
              - 'test/data/**'
              - 'spack_repo/**'
              - '.github/actions/**'
              - '.github/workflows/lookahead.yml'

  build-test-x64-gcc:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          run-regression-tests: 'true'
          use-develop-deps: 'true'

  build-test-gpu-gcc:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          variant: +cuda
          run-regression-tests: 'true'
          use-develop-deps: 'true'

  # Build against the tip of Spack (develop) rather than the pinned 1.2 release
  # series, to catch upstream Spack/spack-packages changes that break Palace.
  # Dependencies stay at their pinned versions so a failure points at Spack.
  # This job writes only to the isolated palace-develop buildcache, never the
  # pinned Spack 1.2 cache used by required CI.
  build-test-x64-gcc-spack-develop:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          run-regression-tests: 'true'
          spack-version: 'develop'

  # Refresh the develop index after its cache-producing job. Keep this separate
  # from the build so fork runs can skip the mutation stage entirely and use a
  # stable concurrency group to serialize index writers across all PRs.
  refresh-develop-buildcache-index:
    needs:
      - filter
      - build-test-x64-gcc-spack-develop
    if: |
      !cancelled() &&
      needs.filter.outputs.test == 'true' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize writers from different PR refs. A newer run on the same ref may
    # cancel the parent workflow, but the prior complete OCI tag remains visible
    # until a replacement index upload finishes.
    concurrency:
      group: palace-develop-buildcache-index
      cancel-in-progress: false
    steps:
      - name: Install Spack develop
        uses: actions/checkout@v6
        with:
          repository: spack/spack
          path: spack
          ref: develop

      - name: Refresh Spack develop buildcache index
        shell: bash
        run: |
          INDEX_ENV="${RUNNER_TEMP}/spack-buildcache-index"
          mkdir -p "${INDEX_ENV}"
          cat > "${INDEX_ENV}/spack.yaml" << 'EOF'
          spack:
            specs: []
            mirrors:
              local-buildcache:
                binary: true
                url: oci://ghcr.io/awslabs/palace-develop
                signed: false
                access_pair:
                  id_variable: GITHUB_USER
                  secret_variable: GITHUB_TOKEN
          EOF
          START_TIME=${SECONDS}
          SPACK_DISABLE_LOCAL_CONFIG=1 spack/bin/spack -e "${INDEX_ENV}" \
            buildcache update-index local-buildcache
          echo "Spack develop buildcache index refresh: $((SECONDS - START_TIME))s"
