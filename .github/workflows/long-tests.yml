# Runs long, expensive tests on self-hosted large runners.
#
# On a pull request, the `long-tests` job succeeds either when testing is
# deferred (there is no `trigger-long-tests` label), or after the tests pass.
# New commits are tested automatically while the label remains present.
#
# Every merge to main runs the tests too, so that the logs record the wall time
# of the long cases after each merge.
name: Long Tests

on:
  pull_request:
    types: [labeled, opened, synchronize]
  push:
    branches: [main]

permissions:
  packages: read
  contents: read

# Pull request workflows cannot filter label events by name. Unrelated label
# events therefore use a unique concurrency group and a differently named
# reporting job, so they cannot cancel a test or replace its result. Each push
# to main also has a group of its own: a later merge must not cancel it, or that
# merge has no timings.
concurrency:
  group: >-
    long-tests-${{ (github.event_name == 'push' ||
    (github.event.action == 'labeled' &&
    github.event.label.name != 'trigger-long-tests')) &&
    github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: run-long-tests
    if: |
      github.repository == 'awslabs/palace' &&
      (
        github.event_name == 'push' ||
        (
          contains(github.event.pull_request.labels.*.name, 'trigger-long-tests') &&
          (
            github.event.action != 'labeled' ||
            github.event.label.name == 'trigger-long-tests'
          )
        )
      )
    runs-on: [self-hosted, x64]
    timeout-minutes: 180
    steps:
      # On a push, the merge commit on main; on a pull request, its head.
      - name: Check out authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/palace-ci
        with:
          toolchain: gcc
          test-cases: long

  long-tests:
    name: >-
      ${{ (github.event.action == 'labeled' &&
      github.event.label.name != 'trigger-long-tests') &&
      'long-tests (ignored event)' || 'long-tests' }}
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          REQUESTED: >-
            ${{ github.repository == 'awslabs/palace' &&
            (github.event_name == 'push' ||
            (contains(github.event.pull_request.labels.*.name, 'trigger-long-tests') &&
            (github.event.action != 'labeled' ||
            github.event.label.name == 'trigger-long-tests'))) }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          if [[ "$REQUESTED" != "true" ]]; then
            exit 0
          fi

          case "$TEST_RESULT" in
            success)
              echo "Long tests passed."
              ;;
            cancelled)
              echo "::error::Long tests were cancelled."
              exit 1
              ;;
            skipped)
              echo "::error::Long tests did not run."
              exit 1
              ;;
            *)
              echo "::error::Long tests failed ($TEST_RESULT)."
              exit 1
              ;;
          esac
