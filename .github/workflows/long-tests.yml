# This workflow runs long tests on a PR when the 'trigger-long-tests' label is
# added. Long tests are a required check for merging non-trivial PRs.
#
# The typical workflow is:
# 1. Developer iterates using the short (default) tests
# 2. When ready to merge, add the 'trigger-long-tests' label
# 3. Long tests run and the long-tests status is updated
#
# If the PR is updated while the label is present, the tests re-run
# automatically. It can also be run manually from the GitHub Actions UI.
name: Long Tests
run-name: >-
  Long Tests ${{
    (
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.pull_request.labels.*.name, 'no-long-tests') &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'trigger-long-tests') ||
          (
            github.event.action == 'unlabeled' &&
            github.event.label.name == 'no-long-tests' &&
            contains(github.event.pull_request.labels.*.name, 'trigger-long-tests')
          ) ||
          (
            (github.event.action == 'opened' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'trigger-long-tests')
          ) ||
          (
            github.event.action == 'synchronize' &&
            contains(github.event.pull_request.labels.*.name, 'trigger-long-tests')
          )
        )
      )
    ) && 'requested' || 'not-requested'
  }}

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]

permissions:
  packages: read
  contents: read
  pull-requests: read

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  long-tests:
    runs-on: [self-hosted, x64]
    # Run if:
    # - manually triggered from the Actions UI, OR
    # - the 'trigger-long-tests' label was just added, OR
    # - the PR was updated and already has the 'trigger-long-tests' label
    # Fork code still requires the repository's normal maintainer approval.
    # Its token and Spack cache access remain read-only.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.pull_request.labels.*.name, 'no-long-tests') &&
        (
          (github.event.action == 'labeled' && github.event.label.name == 'trigger-long-tests') ||
          (
            github.event.action == 'unlabeled' &&
            github.event.label.name == 'no-long-tests' &&
            contains(github.event.pull_request.labels.*.name, 'trigger-long-tests')
          ) ||
          (
            (github.event.action == 'opened' || github.event.action == 'reopened') &&
            contains(github.event.pull_request.labels.*.name, 'trigger-long-tests')
          ) ||
          (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'trigger-long-tests'))
        )
      )
    # Apply cancellation only to jobs that actually run. An unrelated label
    # event creates a skipped job and must not cancel active long tests.
    concurrency:
      group: long-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/palace-ci
        with:
          toolchain: gcc
          test-cases: long

  # The trusted workflow_run path in Long Test Status Manager reports this
  # result. The pull_request token is read-only for forks, even after approval.
