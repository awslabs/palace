# Runs long, expensive tests on self-hosted large runners.
#
# The `long-tests` job succeeds either when testing is deferred (there is no
# `trigger-long-tests` label), or after the tests pass. New commits are tested
# automatically while the label remains present.
name: Long Tests

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  packages: read
  contents: read

# Pull request workflows cannot filter label events by name. Unrelated label
# events therefore use a unique concurrency group and a differently named
# reporting job, so they cannot cancel a test or replace its result.
concurrency:
  group: >-
    long-tests-${{ (github.event.action == 'labeled' &&
    github.event.label.name != 'trigger-long-tests') &&
    github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: run-long-tests
    if: |
      github.repository == 'awslabs/palace' &&
      contains(github.event.pull_request.labels.*.name, 'trigger-long-tests') &&
      (
        github.event.action != 'labeled' ||
        github.event.label.name == 'trigger-long-tests'
      )
    runs-on: [self-hosted, x64]
    steps:
      - name: Check out authorized revision
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/actions/palace-ci
        with:
          toolchain: gcc
          test-cases: long

  long-tests:
    name: >-
      ${{ (github.event.action == 'labeled' &&
      github.event.label.name != 'trigger-long-tests') &&
      'long-tests (ignored event)' || 'long-tests' }}
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          REQUESTED: >-
            ${{ github.repository == 'awslabs/palace' &&
            contains(github.event.pull_request.labels.*.name, 'trigger-long-tests') &&
            (github.event.action != 'labeled' ||
            github.event.label.name == 'trigger-long-tests') }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          if [[ "$REQUESTED" != "true" ]]; then
            exit 0
          fi

          case "$TEST_RESULT" in
            success)
              echo "Long tests passed."
              ;;
            cancelled)
              echo "::error::Long tests were cancelled."
              exit 1
              ;;
            skipped)
              echo "::error::Long tests did not run."
              exit 1
              ;;
            *)
              echo "::error::Long tests failed ($TEST_RESULT)."
              exit 1
              ;;
          esac
