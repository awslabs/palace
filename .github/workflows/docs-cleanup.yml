name: gh-pages Cleanup

permissions:
  contents: write
  pull-requests: read

on:
  # pull_request_target runs this workflow as it is on main, also for pull requests from
  # forks and for those that branched off before a change to it. It never checks out the code
  # of the pull request.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '0 3 * * 0'  # Weekly, Sunday 3 AM UTC
  workflow_dispatch:

concurrency:
  group: gh-pages-cleanup
  cancel-in-progress: false

jobs:
  # Each run removes the previews of all closed pull requests, including those that a
  # deployment finishing after its pull request closed brought back.
  # A run that loses a race with a deployment leaves gh-pages alone; the next run catches up.
  cleanup:
    # Runs started by Dependabot get a read-only token; the weekly run catches up.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Only the tree is needed: fetch gh-pages without its files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/gh-pages
          filter: blob:none
          sparse-checkout: /.nojekyll
          sparse-checkout-cone-mode: false

      - name: Remove the previews of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          # Fail instead of downloading the files of the site.
          GIT_NO_LAZY_FETCH: 1
        run: |
          head=$(git rev-parse HEAD)
          closed=()
          while IFS= read -r dir; do
            # Documenter names the previews previews/PR<number>; leave anything else alone.
            [[ "$dir" =~ ^previews/PR([0-9]+)$ ]] || continue
            # Remove a preview only once GitHub says that its pull request is closed.
            state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${BASH_REMATCH[1]}" --jq .state)
            if [[ "$state" == closed ]]; then
              closed+=("$dir")
            fi
          done < <(git ls-tree -d --name-only "$head" previews/)
          if [[ ${#closed[@]} -eq 0 ]]; then
            echo "No previews of closed pull requests"
            exit 0
          fi
          printf 'Removing %s\n' "${closed[@]}"

          # The checkout left the index at $head. Like the documentation deployments, keep
          # gh-pages a single commit.
          git rm -r -q --cached --sparse -- "${closed[@]}"
          tree=$(git write-tree)
          commit=$(git -c user.name="Documenter.jl" -c user.email="documenter@juliadocs.github.io" \
            commit-tree "$tree" -m "Remove the previews of ${#closed[@]} closed pull requests")
          if ! git push --force-with-lease="gh-pages:${head}" origin \
              "${commit}:refs/heads/gh-pages"; then
            if [[ "$(git ls-remote origin refs/heads/gh-pages | cut -f1)" == "$head" ]]; then
              exit 1  # Not a race with a deployment
            fi
            echo "::warning::gh-pages changed during the cleanup; the next run will remove these."
          fi
