name: Spack

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  packages: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Filter to allow skipping the test if no relevant changes occurred.
  filter:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            test:
              - 'palace/**'
              - 'cmake/**'
              - 'extern/**'
              - 'examples/**'
              - 'test/unit/**'
              - 'test/data/**'
              - 'spack_repo/**'
              - '.github/actions/**'
              - '.github/workflows/spack.yml'

  # Build jobs
  build-x64-gcc:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          run-regression-tests: 'false'

  build-gpu-gcc:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          variant: +cuda+cudss
          run-regression-tests: 'false'

  build-x64-gcc-openmp:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          variant: "+openmp+int64"
          run-regression-tests: 'false'

  build-x64-gcc-cxx20:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          variant: " cxxstd=20"
          run-regression-tests: 'false'

  build-test-x64-llvm:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: llvm
          additional-test-cases: transmon_coarse

  build-test-x64-intel:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, x64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: intel-oneapi
          additional-test-cases: transmon_coarse

  build-test-arm64-gcc:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          additional-test-cases: transmon_coarse

  build-test-arm64-llvm:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: llvm
          additional-test-cases: transmon_coarse

  build-test-arm64-gcc-armpl:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/palace-ci
        with:
          publish-buildcache: 'true'
          toolchain: gcc
          math-libs: armpl-gcc
          additional-test-cases: transmon_coarse

  # Refresh the shared Spack 1.2 buildcache index once all cache writers have
  # finished. Regression jobs can start as soon as their own build completes,
  # so this full index rebuild is not on their critical path. The index is
  # best-effort: binaries pushed concurrently remain available through Spack's
  # direct OCI-tag fallback and will be included by the next refresh.
  refresh-buildcache-index:
    needs:
      - filter
      - build-x64-gcc
      - build-gpu-gcc
      - build-x64-gcc-openmp
      - build-x64-gcc-cxx20
      - build-test-x64-llvm
      - build-test-x64-intel
      - build-test-arm64-gcc
      - build-test-arm64-llvm
      - build-test-arm64-gcc-armpl
    if: |
      !cancelled() &&
      needs.filter.outputs.test == 'true' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    # Serialize index writers across branches and PRs. Cache package pushes are
    # immutable and may remain concurrent, but index.spack has one shared tag.
    # A newer run for the same ref may cancel the parent workflow; until a
    # replacement upload completes, OCI readers retain the prior complete tag.
    concurrency:
      group: palace-1.2-buildcache-index
      cancel-in-progress: false
    steps:
      - name: Install Spack 1.2
        uses: actions/checkout@v6
        with:
          repository: spack/spack
          path: spack
          ref: releases/v1.2

      - name: Refresh GHCR buildcache index
        shell: bash
        run: |
          INDEX_ENV="${RUNNER_TEMP}/spack-buildcache-index"
          mkdir -p "${INDEX_ENV}"
          cat > "${INDEX_ENV}/spack.yaml" << 'EOF'
          spack:
            specs: []
            mirrors:
              local-buildcache:
                binary: true
                url: oci://ghcr.io/awslabs/palace-1.2
                signed: false
                access_pair:
                  id_variable: GITHUB_USER
                  secret_variable: GITHUB_TOKEN
          EOF
          SPACK_DISABLE_LOCAL_CONFIG=1 spack/bin/spack -e "${INDEX_ENV}" \
            buildcache update-index local-buildcache

  # Test jobs
  test-x64-gcc:
    needs: [filter, build-x64-gcc]
    if: success()
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: MUMPS
          - solver: SuperLU
          - solver: STRUMPACK
          - solver: Default
    runs-on: [self-hosted, x64-4xlarge]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-regression-tests
        with:
          toolchain: gcc
          linear-solver: ${{ matrix.solver }}

  test-gpu-gcc:
    needs: [filter, build-gpu-gcc]
    if: success()
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: MUMPS
          - solver: SuperLU
          - solver: STRUMPACK
          - solver: Default
          - solver: cuDSS
    runs-on: [self-hosted, gpu-4xlarge]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-regression-tests
        with:
          toolchain: gcc
          variant: +cuda+cudss
          linear-solver: ${{ matrix.solver }}

  test-x64-gcc-openmp:
    needs: [filter, build-x64-gcc-openmp]
    if: success()
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: MUMPS
          - solver: SuperLU
          - solver: STRUMPACK
          - solver: Default
    runs-on: [self-hosted, x64-4xlarge]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-regression-tests
        with:
          toolchain: gcc
          variant: "+openmp+int64"
          linear-solver: ${{ matrix.solver }}
