name: Spack (macOS)

# Builds Palace on macOS (Apple Silicon) *through Spack* and runs its unit
# tests. This is the Spack analogue of build-and-test-macos.yml (which uses the
# Homebrew + raw CMake path) and doubles as a build test for the Spack recipe on
# macOS (awslabs/palace#766).
#
# palace-ci / setup-runner are Linux-only (apt, sudo, LLVM/Intel PPAs, lscpu),
# so this workflow inlines everything, the same way build-and-test-macos.yml
# does. It borrows the shape of palace-ci's spack.yaml generation, adapted for
# macOS: GNU (gcc/g++/gfortran) builds the library DAG, while build tools that
# should not be compiled with GNU are provided by Homebrew.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Filter to allow skipping the test if no relevant changes occurred.
  filter:
    runs-on: macos-15
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            test:
              - 'palace/**'
              - 'cmake/**'
              - 'extern/**'
              - 'examples/**'
              - 'test/unit/**'
              - 'test/data/**'
              - 'spack_repo/**'
              - 'docs/src/developer/spack/spack.yaml'
              - '.github/workflows/spack-macos.yml'

  build-test-macos-spack:
    needs: filter
    if: needs.filter.outputs.test == 'true'
    runs-on: macos-15-xlarge
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      # Install the toolchain from Homebrew rather than relying on whatever the
      # runner image preinstalls, so this job matches what a developer starting
      # from a stock macOS box would have. The runner ships cmake, python, and
      # other build tools; a developer generally does not, so depending on them
      # would test a machine configuration nobody actually has.
      #
      # gcc (with g++/gfortran) compiles the whole build; see the packages:
      # block in "Prepare spack.yaml" for why. Build-only tools are provided by
      # Homebrew so Spack can focus on the library DAG. openmpi/openblas are
      # still built by Spack from the spec/cache for reproducibility (the same
      # way palace-ci builds them on Linux instead of apt-installing).
      - name: Install build tools from Homebrew
        run: |
          # GitHub's runner image includes this tap, but none of the formulas
          # below use it. Remove it rather than weakening Homebrew's tap trust
          # checks or asking developers to trust an unrelated third-party tap.
          if brew tap | grep -qx aws/tap; then
            brew untap aws/tap
          fi

          brew install \
            gcc \
            autoconf \
            automake \
            cmake \
            diffutils \
            libtool \
            m4 \
            perl \
            pkgconf \
            python

      - name: Setup Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: releases/v1.2
          packages_ref: releases/v2026.06
          buildcache: true
          color: true

      - name: Patch Spack package.py files for known problems
        run: |
          PALACE_DIR=$PWD
          cd "$(spack location --repo builtin)"
          for patch in "$PALACE_DIR"/spack_repo/patches/*.diff; do
            if [ -f "$patch" ]; then
              if ! git apply --check "$patch" 2>/dev/null; then
                echo "Cannot apply $patch (PR may have already been merged)"
                echo "Please remove $patch from the Palace repo if the PR was merged"
              else
                echo "Applying patch: $patch"
                git apply "$patch"
              fi
            fi
          done
          # Workaround for https://github.com/spack/spack/issues/51505
          ln -sf "$(spack location --repo builtin)"/packages/mfem "$PALACE_DIR"/spack_repo/local/packages/

      - name: Prepare spack.yaml
        run: |
          cp docs/src/developer/spack/spack.yaml spack.yaml

          # Isolate GHCR buildcaches by Spack version (see palace-ci). Darwin
          # binaries carry platform=darwin + the microarch in their DAG hash, so
          # they never collide with the Linux OCI tags in the same cache.
          PALACE_BUILD_CACHE_NAME="palace-1.2"
          echo "PALACE_BUILD_CACHE_NAME=${PALACE_BUILD_CACHE_NAME}" >> "${GITHUB_ENV}"
          echo "GHCR buildcache package: ghcr.io/awslabs/${PALACE_BUILD_CACHE_NAME}"

          # CI-specific settings stay out of the developer environment.
          spack -e . repo add --scope="env:$(pwd)" "$(pwd)/spack_repo/local"
          spack -e . mirror add --type binary --unsigned \
            --oci-username-variable GITHUB_USER \
            --oci-password-variable GITHUB_TOKEN \
            local-buildcache \
            "oci://ghcr.io/awslabs/${PALACE_BUILD_CACHE_NAME}"

      - name: Configure Compilers
        run: |
          spack -e . compiler find "$(brew --prefix gcc)/bin"
          spack -e . compiler list

          # Register build tools as externals so Spack does not rebuild them
          # with gcc, which the global gcc requirement would otherwise force:
          #   - python: CPython has a hard "platform=darwin %gcc" conflict (it
          #     does not build with gcc on macOS) and is a build dep of
          #     petsc/libxsmm.
          #   - cmake: its macOS source uses __builtin_available, an
          #     apple-clang-only builtin that gcc cannot compile.
          #   - perl and autotools: together they pull in a large build-only
          #     dependency chain and are used to regenerate OpenMPI's build
          #     system.
          #   - diffutils: a PETSc build dependency that otherwise also pulls
          #     Spack's libiconv into the build-only dependency chain.
          #   - pkgconf: a build-only dependency used by Palace and OpenMPI.
          # Taking them as externals keeps the compiled DAG entirely gcc.
          #
          # Search only the Homebrew prefixes, never the whole PATH: `--path`
          # replaces the default PATH scan rather than adding to it, so this
          # pins each external to the brew copy installed above instead of
          # silently picking up a runner-preinstalled tool a developer would not
          # have.
          spack -e . external find --not-buildable \
            --path "$(brew --prefix autoconf)/bin" \
            --path "$(brew --prefix automake)/bin" \
            --path "$(brew --prefix cmake)/bin" \
            --path "$(brew --prefix diffutils)/bin" \
            --path "$(brew --prefix libtool)/bin" \
            --path "$(brew --prefix m4)/bin" \
            --path "$(brew --prefix perl)/bin" \
            --path "$(brew --prefix pkgconf)/bin" \
            --path "$(brew --prefix python)/bin" \
            autoconf automake cmake diffutils libtool m4 perl pkgconf python

          # `external find` reports nothing and exits 0 when a package is not
          # found, which would silently fall back to building the tool with gcc
          # (or, for python, hitting its %gcc conflict) much later in the run.
          # Fail here instead, where the cause is obvious.
          for tool in autoconf automake cmake diffutils libtool m4 perl pkgconf python; do
            if ! spack -e . config get packages | grep -q "^  ${tool}:"; then
              echo "::error::Expected external '${tool}' was not detected"
              exit 1
            fi
          done

      - name: Display spack.yaml
        run: |
          echo "=== Generated spack.yaml ==="
          cat spack.yaml
          echo "=== End spack.yaml ==="

      - name: Bootstrap
        run: spack -e . bootstrap now

      - name: Concretize
        env:
          PALACE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          PALACE_REF="${PALACE_REF//\//-}"
          spack -e . develop --path="$(pwd)" local.palace@git."${PALACE_REF}"=develop
          spack -e . concretize -f --test root

      - name: Build Dependencies
        run: |
          NPROC=$(sysctl -n hw.ncpu)
          # Bank built deps even if a later install fails. The CLI push skips
          # non-redistributable specs; skip --update-index since installs probe
          # OCI tags directly.
          bank_progress() {
            spack -e . buildcache push --allow-missing --with-build-dependencies --only dependencies --unsigned local-buildcache || true
          }
          # No --fail-fast: build (and bank) everything possible; retry to ride
          # out transient source-fetch failures.
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            if spack -e . install --only-concrete --no-check-signature --show-log-on-error --include-build-deps --only dependencies --test root -j "$NPROC"; then
              bank_progress
              break
            fi
            bank_progress
            if [ "$attempt" -eq "$attempts" ]; then
              echo "Dependency installation failed after ${attempts} attempts."
              exit 1
            fi
            echo "Dependency installation attempt ${attempt} failed; retrying."
          done

      - name: Build Palace
        run: |
          NPROC=$(sysctl -n hw.ncpu)
          # palace@develop is pinned to a branch, so every branch shares a spec
          # hash with different source. Build Palace --no-cache and push only
          # deps (below).
          spack -e . install --only-concrete --keep-stage --show-log-on-error --only package --no-cache --test root -j "$NPROC"

      - name: Run Unit Tests
        run: |
          eval "$(spack -e . load --sh palace)"

          # Apple Silicon has no SMT, so physical == logical cores.
          NUM_PROC_TEST=$(sysctl -n hw.physicalcpu)
          export OMP_NUM_THREADS=1

          cd "$(spack -e . location -b palace)"

          # Disable OpenMPI 5.x default CPU binding so ranks don't oversubscribe
          # during parallel test execution (PRRTE + legacy OMPI MCA vars).
          export PRTE_MCA_hwloc_default_binding_policy=none
          export OMPI_MCA_hwloc_base_binding_policy=none

          # [Regression] and [Long] cases run elsewhere; skip them here.
          ctest -j "$NUM_PROC_TEST" --output-on-failure -LE "^(regression|long)$"

      - name: Push to GHCR cache
        if: always()
        run: |
          # Push deps only; Palace itself is branch-specific (see Build Palace).
          # Do not force-overwrite existing spec tags: OCI installs probe tags
          # directly and replacing a tag can invalidate consumers.
          spack -e . buildcache push --allow-missing --with-build-dependencies --only dependencies --unsigned local-buildcache || true
