name: Containers

# Release-tag container build (vX.Y.Z).
#
# Non-tag events (push to main, PRs, manual dispatch) are built per host by the
# containers-x64 / containers-arm64 / containers-gpu workflows, so each host
# publishes as soon as it is built. Release tags instead build the full
# microarchitecture matrix HERE, in a single workflow run, so a whole version
# publishes atomically from one publish job rather than trickling out per host:
# - x86_64_v3, x86_64_v4, sapphirerapids   on the x64 (sapphirerapids) host
# - aarch64, neoverse_v2                   on the arm64-8g (neoverse_v2) host
# - neoverse_v1                            on the arm64 (neoverse_v1) host
# - x86_64_v3_cuda                         on the gpu (x86_64_v3) host
# Each target is at or below its host's native ISA, so build-time binaries run
# on the host (no cross-compile-up). neoverse_v1 builds on its own native V1
# host: the target pin is only a preference, and on the V2 host Spack ignored it
# and concretized to neoverse_v2 (publishing a V2 binary under the V1 tag).
#
# Each leg calls the reusable container-build-leg workflow, which runs INLINE in
# this run, so this workflow is the single `workflow_run` the trusted
# publish-containers workflow keys on for the whole release.

on:
  push:
    tags: ['v*']

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No paths-filter: a tag is usually cut on a commit already on main, so the
  # diff is empty and the filter would skip, silently dropping the versioned
  # publish (the reusable build also treats a tag ref as an unconditional build).
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: x64,      target: x86_64_v3}
          - {runner: x64,      target: x86_64_v4}
          - {runner: x64,      target: sapphirerapids}
          - {runner: arm64-8g, target: aarch64}
          - {runner: arm64,    target: neoverse_v1}
          - {runner: arm64-8g, target: neoverse_v2}
          - {runner: gpu,      target: x86_64_v3}
    uses: ./.github/workflows/container-build-leg.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      # Fetch tags so the release channel can derive the version from the ref.
      fetch-depth: 0
