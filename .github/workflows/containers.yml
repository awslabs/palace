name: Backfill Release Containers

# THROWAWAY one-shot workflow to backfill generic container images for
# ALREADY-RELEASED Palace versions into the internal ECR repo + S3 bucket.
# Unlike containers.yml (which builds the develop source tree), this builds
# `palace@<version>` from the spack recipe's pinned release commit.
#
# Deliberately self-contained: it does NOT reuse .github/actions/build-container
# (whose example-test step runs TODAY's examples against the OLD binary and would
# abort older versions). No test step here. Delete this file once backfill is done.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released Palace version to build (must exist in spack_repo recipe), e.g. 0.16.1'
        type: string
        required: true

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.version }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_REGION: us-west-2
  ECR_REPOSITORY: palace
  S3_BUCKET: palace-ci-containers

jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: x64, target: x86_64_v3}
          - {runner: arm64-8g, target: aarch64}
    runs-on: [self-hosted, '${{ matrix.runner }}']
    steps:
      - uses: actions/checkout@v6

      - name: Check destination state
        id: destination
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          ARCH_LABEL: ${{ matrix.target }}
        run: |
          S3_KEY="${VERSION}/${ARCH_LABEL}.sif"
          ECR_TAG="${VERSION}-${ARCH_LABEL}"

          s3_exists=false
          if aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$S3_BUCKET" \
            --key "$S3_KEY" >/dev/null 2>&1; then
            s3_exists=true
          fi

          ecr_exists=false
          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${ECR_TAG}" >/dev/null 2>&1; then
            ecr_exists=true
          fi

          if [[ "$s3_exists" == true && "$ecr_exists" == true ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${VERSION}/${ARCH_LABEL} is already fully published; skipping."
          elif [[ "$s3_exists" == true || "$ecr_exists" == true ]]; then
            echo "::error::Partial destination state for ${VERSION}/${ARCH_LABEL}: S3=${s3_exists}, ECR=${ecr_exists}"
            exit 1
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup environment
        if: steps.destination.outputs.build == 'true'
        uses: ./.github/actions/setup-runner
        with:
          spack-version: 'develop'
          julia-version: 'dont-install'
          llvm-version: 'dont-install'
          setup-intel: 'false'

      - name: Install Podman
        if: steps.destination.outputs.build == 'true'
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt update
          sudo apt install -y podman apptainer
          echo 'unqualified-search-registries = ["docker.io"]' | sudo tee /etc/containers/registries.conf.d/docker.conf

      - name: Pin spack env to the requested release
        if: steps.destination.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          SPACK_YAML=.github/actions/build-container/spack_env/spack.yaml

          # Build the tagged release from the recipe instead of the develop
          # source tree: swap the spec version and drop the develop: path
          # override (which pins palace to the checked-out /opt/palace source).
          sed -i -E "s/palace@develop/palace@${VERSION}/" "$SPACK_YAML"

          # Remove the `develop:` block (4 lines under `override:`). yq isn't a
          # build dep; use a small python edit so we don't depend on key order.
          python3 - "$SPACK_YAML" <<'PY'
          import sys, re
          p = sys.argv[1]
          text = open(p).read()
          # Strip the develop: ... palace: ... path: /opt/palace mapping.
          text = re.sub(r"\n\s*develop:\n(?:\s+.*\n)+?(?=\s*specs:|\Z)", "\n", text)
          open(p, "w").write(text)
          PY

          spack -e .github/actions/build-container/spack_env \
            config add "packages:all:target:[${TARGET}]"

          echo "=== resulting spec block ==="
          grep -nE "palace@|develop:|path:" "$SPACK_YAML" || true
          spack -e .github/actions/build-container/spack_env config get packages

      - name: Compute names
        if: steps.destination.outputs.build == 'true'
        id: name
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          ARCH_LABEL: ${{ matrix.target }}
        run: |
          IMAGE_NAME="palace-${ARCH_LABEL}-${VERSION}"
          echo "arch_label=${ARCH_LABEL}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Arch label: ${ARCH_LABEL}"
          echo "Image name: ${IMAGE_NAME}"

      - name: Generate Dockerfile
        if: steps.destination.outputs.build == 'true'
        shell: bash
        run: |
          cd .github/actions/build-container/spack_env && spack -e . containerize > "$GITHUB_WORKSPACE/Dockerfile"

      - name: Build OCI image
        if: steps.destination.outputs.build == 'true'
        shell: bash
        run: |
          sudo podman build --format docker \
            --build-arg GITHUB_USER="$GITHUB_USER" \
            --build-arg GITHUB_TOKEN="$GITHUB_TOKEN" \
            -t ${{ steps.name.outputs.image_name }} .

      - name: Save and convert to SIF
        if: steps.destination.outputs.build == 'true'
        shell: bash
        run: |
          sudo podman save ${{ steps.name.outputs.image_name }}:latest -o ${{ steps.name.outputs.image_name }}.tar
          sudo chmod a+r ${{ steps.name.outputs.image_name }}.tar
          sudo apptainer build ${{ steps.name.outputs.image_name }}.sif docker-archive://${{ steps.name.outputs.image_name }}.tar
          sudo chmod a+r ${{ steps.name.outputs.image_name }}.sif

      - name: Push OCI image to ECR
        if: steps.destination.outputs.build == 'true'
        # Auth is ambient via the runner's EC2 instance role.
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          ARCH_LABEL: ${{ steps.name.outputs.arch_label }}
          IMAGE_NAME: ${{ steps.name.outputs.image_name }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::${ACCOUNT_ID}"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REMOTE_TAG="${REGISTRY}/${ECR_REPOSITORY}:${VERSION}-${ARCH_LABEL}"

          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${VERSION}-${ARCH_LABEL}" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing ECR tag ${VERSION}-${ARCH_LABEL}"
            exit 1
          fi

          aws ecr get-login-password --region "$AWS_REGION" \
            | sudo podman login --username AWS --password-stdin "$REGISTRY"
          sudo podman tag "${IMAGE_NAME}:latest" "$REMOTE_TAG"
          sudo podman push "$REMOTE_TAG"
          echo "Pushed image to ${REMOTE_TAG}"

      - name: Upload SIF to S3
        if: steps.destination.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          ARCH_LABEL: ${{ steps.name.outputs.arch_label }}
          IMAGE_NAME: ${{ steps.name.outputs.image_name }}
        run: |
          S3_KEY="${VERSION}/${ARCH_LABEL}.sif"
          aws s3api put-object \
            --region "$AWS_REGION" \
            --bucket "$S3_BUCKET" \
            --key "$S3_KEY" \
            --body "${IMAGE_NAME}.sif" \
            --if-none-match '*'
          echo "Uploaded SIF to s3://${S3_BUCKET}/${S3_KEY}"

      - name: Verify published artifacts
        if: steps.destination.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
          ARCH_LABEL: ${{ steps.name.outputs.arch_label }}
        run: |
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${VERSION}-${ARCH_LABEL}" >/dev/null
          aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$S3_BUCKET" \
            --key "${VERSION}/${ARCH_LABEL}.sif" >/dev/null
